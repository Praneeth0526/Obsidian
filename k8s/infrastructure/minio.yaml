apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: hpe-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          imagePullPolicy: IfNotPresent
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin123"
            - name: MINIO_SITE_NAME
              value: "hpe-search-minio"
            - name: MINIO_NOTIFY_KAFKA_ENABLE_1
              value: "on"
            - name: MINIO_NOTIFY_KAFKA_BROKERS_1
              value: "kafka-0.kafka-headless.hpe-search.svc.cluster.local:9092,kafka-1.kafka-headless.hpe-search.svc.cluster.local:9092,kafka-2.kafka-headless.hpe-search.svc.cluster.local:9092"
            - name: MINIO_NOTIFY_KAFKA_TOPIC_1
              value: "file-upload-events"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
# S3 API — internal
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: hpe-search
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
# Web console — NodePort for browser access
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: hpe-search
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
