apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: hpe-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
    spec:
      containers:
        - name: model-server
          image: hpe-model-server:latest
          imagePullPolicy: Never          # loaded via: minikube image load hpe-model-server:latest
          envFrom:
            - configMapRef:
                name: hpe-search-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60       # model download + load takes time on first run
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "6Gi"
              cpu: "2000m"
              nvidia.com/gpu: 1
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-model-server
---
apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: hpe-search
spec:
  selector:
    app: model-server
  ports:
    - port: 8000
      targetPort: 8000
