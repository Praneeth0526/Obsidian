apiVersion: v1
kind: ConfigMap
metadata:
  name: hpe-search-config
  namespace: hpe-search
data:
  # Kafka — all 3 pod DNS names as bootstrap for reliability
  KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka-headless.hpe-search.svc.cluster.local:9092,kafka-1.kafka-headless.hpe-search.svc.cluster.local:9092,kafka-2.kafka-headless.hpe-search.svc.cluster.local:9092"
  KAFKA_TOPIC: "file-upload-events"
  KAFKA_GROUP_ID: "ingestion-worker"
  KAFKA_CLUSTER_ID: "hpe-search-local-cluster-1"

  # MinIO
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"
  MINIO_SECURE: "false"
  MINIO_PUBLIC_URL: "http://minio:9000"

  # Tika
  TIKA_SERVER_URL: "http://tika:9998"

  # Model server
  MODEL_SERVER_URL: "http://model-server:8000"
  MODEL_SERVER_HOST: "0.0.0.0"
  MODEL_SERVER_PORT: "8000"
  HF_HOME: "/root/.cache/huggingface"

  # OpenSearch
  OPENSEARCH_HOST: "opensearch"
  OPENSEARCH_PORT: "9200"
  OPENSEARCH_INDEX: "hpe-search-docs"
  OPENSEARCH_BULK_CHUNK_SIZE: "200"
  OPENSEARCH_MAX_RETRIES: "5"
  OPENSEARCH_RETRY_BASE_DELAY: "1.0"

  # Search (pyworker / gateway)
  GRPC_HOST: "0.0.0.0"
  GRPC_SEARCH_PORT: "50052"
  PYWORKER_HOST: "pyworker"
  PYWORKER_PORT: "50052"
  SEARCH_KNN_K: "50"
  SEARCH_BM25_BOOST: "0.4"
  SEARCH_KNN_BOOST: "0.6"
  SEARCH_DEFAULT_SIZE: "10"
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_PASSWORD: ""
  REDIS_TTL_DEFAULT: "300"
  REDIS_TTL_POPULAR: "1800"
  REDIS_POPULAR_THRESHOLD: "10"

  # Frontend
  NEXT_PUBLIC_API_BASE: "http://localhost:30080"   # NodePort exposed on host

  # Logging
  LOG_LEVEL: "INFO"
  PYTHONUNBUFFERED: "1"
