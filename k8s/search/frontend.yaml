apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hpe-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hpe-frontend:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: hpe-search-config
          env:
            - name: GATEWAY_URL
              value: "http://go-gateway:8080"
            # Download route: override MINIO_ENDPOINT with full http:// URL
            # (ConfigMap has bare "minio:9000" without protocol)
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_REGION
              value: "us-east-1"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# NodePort 30300 → browser access to the Next.js search UI
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hpe-search
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
