apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gateway
  namespace: hpe-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-gateway
  template:
    metadata:
      labels:
        app: go-gateway
    spec:
      containers:
        - name: go-gateway
          image: hpe-go-gateway:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: hpe-search-config
          env:
            - name: GATEWAY_PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
# NodePort 30080 → exposed on the Minikube host as the REST API entry point
apiVersion: v1
kind: Service
metadata:
  name: go-gateway
  namespace: hpe-search
spec:
  type: NodePort
  selector:
    app: go-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
