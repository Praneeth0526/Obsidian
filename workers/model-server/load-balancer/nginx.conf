# nginx.conf — Load balancer for the Obsidian Model Server
#
# Distributes incoming embedding requests across multiple model-server
# replicas using round-robin.  Each replica runs main.py bound to a
# different port (8001, 8002, 8003, …).
#
# Usage:
#   1. Start N model-server replicas:
#        MODEL_SERVER_PORT=8001 python main.py &
#        MODEL_SERVER_PORT=8002 python main.py &
#        MODEL_SERVER_PORT=8003 python main.py &
#   2. Start Nginx with this config:
#        nginx -c /path/to/nginx.conf
#   3. Point model_client.py at the Nginx upstream (default port 8000):
#        MODEL_SERVER_URL=http://localhost:8000

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # -----------------------------------------------------------------------
    # Upstream — model-server replicas
    # Add or remove server lines to match the number of running replicas.
    # -----------------------------------------------------------------------
    upstream model_server {
        least_conn;                         # route to the replica with fewest active connections
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
        server 127.0.0.1:8003;

        keepalive 32;                       # persistent connections to upstreams
    }

    # -----------------------------------------------------------------------
    # Server block — public-facing proxy
    # -----------------------------------------------------------------------
    server {
        listen 8000;
        server_name _;

        # Increase timeouts for large model inference (image embedding can be
        # slow on CPU for the first request before caches warm up).
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;

        # Required for multipart uploads (/embed/image).
        client_max_body_size 10M;

        location / {
            proxy_pass         http://model_server;
            proxy_http_version 1.1;

            # Enable keep-alive reuse with upstream.
            proxy_set_header   Connection "";

            # Forward original request metadata.
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------------
        # Health check endpoint passthrough
        # -----------------------------------------------------------------------
        location /health {
            proxy_pass         http://model_server/health;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log off;             # suppress noisy health-check log lines
        }
    }
}
